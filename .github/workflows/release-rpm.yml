name: Release RPM

# On a pushed v* tag, build sunshine.spec and publish the RPM as a GitHub release.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # Must match the Fedora release of the image that installs the RPM.
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install rpm-build dnf-plugins-core gh
          dnf -y builddep sunshine.spec

      # with_local: take patches/ and sources/ from this checkout instead of
      # cloning coprrepo, so the RPM matches the tagged commit.
      - name: Build
        run: |
          mkdir -p rpmbuild/SOURCES
          cp -r patches sources rpmbuild/SOURCES/
          rpmbuild -bb sunshine.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "with_local 1"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout has no .git (git isn't in the container yet), so gh can't infer it.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Re-runs reuse the release and replace its RPMs.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --title "$tag" --notes "Built from $GITHUB_SHA"
          find rpmbuild/RPMS -name '*.rpm' ! -name '*-debug*' -print0 |
            xargs -0 gh release upload "$tag" --clobber
