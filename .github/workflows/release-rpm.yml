name: Release RPM

# Build sunshine.spec and attach the RPM to the GitHub release that triggered it.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # Must match the Fedora release of the image that installs the RPM.
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install rpm-build dnf-plugins-core gh
          dnf -y builddep sunshine.spec

      # with_local: take patches/ and sources/ from this checkout instead of
      # cloning coprrepo, so the RPM matches the released commit.
      - name: Build
        run: |
          mkdir -p rpmbuild/SOURCES
          cp -r patches sources rpmbuild/SOURCES/
          rpmbuild -bb sunshine.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "with_local 1"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout has no .git (git isn't in the container yet), so gh can't infer it.
          GH_REPO: ${{ github.repository }}
        run: |
          find rpmbuild/RPMS -name '*.rpm' ! -name '*-debug*' \
            -exec gh release upload "${{ github.event.release.tag_name }}" {} --clobber \;
